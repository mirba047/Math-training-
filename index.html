<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Тренажер ума</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            touch-action: manipulation; 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, system-ui, sans-serif; 
            overflow: hidden;
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .btn-press:active { transform: scale(0.92); background-color: #475569; }
    </style>
</head>
<body class="h-screen flex flex-col select-none">
    
    <!-- Выбор режима -->
    <div class="flex justify-center gap-2 p-4 pt-10 bg-slate-900 shadow-xl">
        <button id="btn-add" class="mode-btn px-4 py-2 rounded-full text-xs font-bold transition-all bg-blue-600 text-white" onclick="setMode('add')">Сложение</button>
        <button id="btn-sub" class="mode-btn px-4 py-2 rounded-full text-xs font-bold transition-all bg-slate-700 text-slate-400" onclick="setMode('sub')">Вычитание</button>
        <button id="btn-mul" class="mode-btn px-4 py-2 rounded-full text-xs font-bold transition-all bg-slate-700 text-slate-400" onclick="setMode('mul')">Умножение</button>
    </div>

    <!-- Область задачи -->
    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div id="equation" class="text-7xl font-black mb-4 text-white tracking-tight"></div>
        <div id="answer-box" class="text-6xl font-bold text-blue-400 h-24 border-b-4 border-slate-700 min-w-[180px] flex items-center justify-center transition-all"></div>
    </div>

    <!-- Клавиатура -->
    <div class="bg-slate-800 p-5 pb-10 rounded-t-[3rem] shadow-2xl">
        <div class="grid grid-cols-3 gap-3 max-w-sm mx-auto">
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('1')">1</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('2')">2</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('3')">3</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('4')">4</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('5')">5</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('6')">6</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('7')">7</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('8')">8</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('9')">9</button>
            <button class="btn-press bg-red-900/40 text-red-400 text-lg font-bold py-5 rounded-2xl" onclick="clearInput()">C</button>
            <button class="btn-press bg-slate-700 text-3xl font-bold py-5 rounded-2xl text-white" onclick="press('0')">0</button>
            <button class="btn-press bg-slate-600 text-2xl py-5 rounded-2xl text-slate-300" onclick="deleteLast()">⌫</button>
        </div>
    </div>

    <script>
        let currentMode = 'add';
        let correctAnswer = 0;
        let currentInput = '';
        let isLocked = false;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.replace('bg-blue-600', 'bg-slate-700');
                btn.classList.replace('text-white', 'text-slate-400');
            });
            const active = document.getElementById(`btn-${mode}`);
            active.classList.replace('bg-slate-700', 'bg-blue-600');
            active.classList.replace('text-slate-400', 'text-white');
            generateQuestion();
        }

        function generateQuestion() {
            let a, b, q, ans;
            if (currentMode === 'add') {
                a = Math.floor(Math.random() * 70) + 14; 
                b = Math.floor(Math.random() * 8) + 3;
                while ((a % 10) + b < 10) b = Math.floor(Math.random() * 8) + 3;
                q = `${a} + ${b}`;
                ans = a + b;
            } else if (currentMode === 'sub') {
                a = Math.floor(Math.random() * 70) + 21;
                let units = a % 10;
                b = units + Math.floor(Math.random() * (9 - units)) + 1;
                if (b > 9) b = 9;
                q = `${a} - ${b}`;
                ans = a - b;
            } else {
                const hard = [6, 7, 8, 9, 12, 13, 14, 16, 17, 18];
                a = hard[Math.floor(Math.random() * hard.length)];
                b = Math.floor(Math.random() * 6) + 4;
                q = `${a} × ${b}`;
                ans = a * b;
            }
            correctAnswer = ans;
            document.getElementById('equation').innerText = q;
            clearInput();
        }

        function press(num) {
            if (isLocked) return;
            currentInput += num;
            updateDisplay();
            check();
        }

        function updateDisplay() {
            document.getElementById('answer-box').innerText = currentInput;
        }

        function clearInput() {
            currentInput = '';
            const box = document.getElementById('answer-box');
            box.className = "text-6xl font-bold text-blue-400 h-24 border-b-4 border-slate-700 min-w-[180px] flex items-center justify-center transition-all";
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function check() {
            const val = parseInt(currentInput);
            const targetLen = correctAnswer.toString().length;

            if (val === correctAnswer) {
                isLocked = true;
                const box = document.getElementById('answer-box');
                box.classList.replace('text-blue-400', 'text-green-400');
                box.classList.replace('border-slate-700', 'border-green-400');
                setTimeout(() => {
                    generateQuestion();
                    isLocked = false;
                }, 300);
            } else if (currentInput.length >= targetLen) {
                isLocked = true;
                const box = document.getElementById('answer-box');
                box.classList.replace('text-blue-400', 'text-red-400');
                box.classList.add('shake');
                setTimeout(() => {
                    box.classList.remove('shake');
                    clearInput();
                    isLocked = false;
                }, 400);
            }
        }

        generateQuestion();
    </script>
</body>
</html>
